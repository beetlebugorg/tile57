<!doctype html>
<!--
  tile57 wasm chartplotter demo. Everything runs in this page: the engine
  bakes S-57 cells (or whole exchange-set zips) to PMTiles archives, composes
  them, and renders every view — no server-side chart work at all.

  Drop cells on the page: .000 files (with their .001.. updates), or a .zip
  exchange set. Drag to pan, wheel to zoom, double-click to zoom in.

  The engine runs in a Web Worker (engine-worker.mjs): a bake holds the CPU
  for seconds and a district zip for minutes, and off the main thread the map
  and the loader stay live the whole time.

  Rendering: WebGPU when the browser has it (the engine emits draw-ready GPU
  scenes; pan/zoom redraws live from uniforms). PNG views otherwise; the HUD
  says which, and why, when it fell back.

  Serve a directory that holds this page, the .mjs modules beside it, and
  tile57-engine.wasm (zig build wasm-engine). Optional:
    ?cells=US5BDRAB/US5BDRAB.000,...   preload cells from ./enc/
    ?wasm=./tile57-engine.wasm         engine module URL
    ?enc=./enc                         cell base URL
    ?png=1                             force the PNG path
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A chartplotter that runs entirely in this page: tile57 compiled to WebAssembly bakes S-57 charts and renders S-52 views, with no server.">
<title>tile57 wasm chartplotter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%E2%9A%93%3C/text%3E%3C/svg%3E">
<style>
  /* The S-52 day colour tokens, replaced at runtime from the engine's own
     colour tables (the `palette` worker op), so the chrome wears the spec's
     colours: NODTA surround, UIBCK panels, UIBDR borders, UINF* text. */
  :root {
    --nodta: #93aebb; --uibck: #c9edff; --uibdr: #4c5b63;
    --uinfd: #000000; --uinff: #4c5b63; --uinfb: #2e7bff;
    --uinfr: #ea5471; --cursr: #e38039;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--nodta);
               font: 13px system-ui, sans-serif; }
  #map, #mapimg { position: fixed; inset: 0; width: 100vw; height: 100vh;
                  touch-action: none; cursor: grab; user-select: none;
                  background: var(--nodta); }
  #mapimg { object-fit: cover; display: none; }
  .dragging { cursor: grabbing !important; }

  #hud { position: fixed; top: 10px; left: 10px; z-index: 3;
         background: var(--uibck); color: var(--uinfd);
         border: 1px solid var(--uibdr); border-radius: 4px;
         padding: 8px 12px; font-family: ui-monospace, monospace; font-size: 12px;
         line-height: 1.5; pointer-events: none; max-width: 46ch; }
  #hud b { color: var(--uinfd); font-weight: 600; }
  #mode, #perf { color: var(--uinff); }
  #cursor { color: var(--cursr); }
  #status { color: var(--uinff); }
  #status.bad { color: var(--uinfr); }

  #ctl { position: fixed; right: 14px; bottom: 18px; z-index: 3;
         display: flex; flex-direction: column; gap: 8px; }
  #ctl button { width: 42px; height: 42px; font-size: 20px; color: var(--uinfd);
                background: var(--uibck); border: 1px solid var(--uibdr);
                border-radius: 4px; cursor: pointer; }
  #ctl button:hover { background: color-mix(in srgb, var(--uibck) 82%, var(--uibdr)); }

  #hint { position: fixed; inset: 0; z-index: 2; display: flex;
          align-items: center; justify-content: center; pointer-events: none; }
  #hint > div { background: var(--uibck); color: var(--uinfd);
                border: 2px dashed var(--uibdr); border-radius: 6px;
                padding: 28px 40px; font-size: 16px; text-align: center;
                line-height: 1.7; }
  #hint small { color: var(--uinff); }
  #hint a { color: var(--uinfb); pointer-events: auto; }
  body.droptarget #hint > div { border-color: var(--uinfb); color: var(--uinfb); }

  /* The loader: alive while the worker bakes. */
  #loader { position: fixed; inset: 0; z-index: 4; display: none;
            align-items: center; justify-content: center;
            background: color-mix(in srgb, var(--uibdr) 30%, transparent);
            pointer-events: none; }
  #loader.show { display: flex; }
  #loader .box { background: var(--uibck); color: var(--uinfd);
                 border: 1px solid var(--uibdr); border-radius: 6px;
                 padding: 22px 30px; min-width: 34ch; text-align: center; }
  #spin { width: 28px; height: 28px; margin: 0 auto 12px;
          border: 3px solid color-mix(in srgb, var(--uibck) 60%, var(--uibdr));
          border-top-color: var(--uinfb);
          border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadlabel { margin-bottom: 10px; }
  #bar { height: 6px; border-radius: 3px; overflow: hidden;
         background: color-mix(in srgb, var(--uibck) 60%, var(--uibdr)); }
  #bar div { height: 100%; width: 0; background: var(--uinfb); transition: width 0.15s; }
  #bar.indeterminate div { width: 30%; animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { margin-left: 0; } to { margin-left: 70%; } }
</style>
</head>
<body>
<canvas id="map"></canvas>
<img id="mapimg" alt="chart view" draggable="false">
<div id="hud">
  <div><b>tile57</b> <span id="mode">loading…</span></div>
  <div id="charts">no charts</div>
  <div id="center"></div>
  <div id="cursor"></div>
  <div id="perf"></div>
  <div id="status">starting engine…</div>
</div>
<div id="ctl">
  <button id="zi" title="zoom in">+</button>
  <button id="zo" title="zoom out">&minus;</button>
  <button id="fs" title="full screen">⛶</button>
</div>
<div id="hint"><div>Drop S-57 charts here<br>
  <small>.000 cells (with their update files), or an exchange-set .zip<br>
  The charts are baked and rendered in this page — nothing is uploaded.<br>
  Free official cells: <a href="https://charts.noaa.gov/ENCs/ENCs.shtml"
  target="_blank" rel="noopener">NOAA ENC downloads</a> — drop a downloaded zip
  straight in.</small></div></div>
<div id="loader"><div class="box">
  <div id="spin"></div>
  <div id="loadlabel">starting engine…</div>
  <div id="bar" class="indeterminate"><div></div></div>
</div></div>

<script>
  // Catch drops from the first paint. The module below spends seconds
  // fetching and compiling the engine, and a drop the page does not cancel
  // navigates the tab to the file. Files dropped before the engine is up are
  // queued and processed once it is.
  window.tile57Drops = { pending: [], handler: null };
  addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("droptarget"); });
  addEventListener("dragleave", () => document.body.classList.remove("droptarget"));
  addEventListener("drop", (e) => {
    e.preventDefault();
    document.body.classList.remove("droptarget");
    const files = [...e.dataTransfer.files];
    if (window.tile57Drops.handler) window.tile57Drops.handler(files);
    else window.tile57Drops.pending.push(...files);
  });
</script>
<script type="module">
import { GpuRenderer, lonLatToWorld, worldToLonLat, scaleDenom } from "./gpu-renderer.mjs";
import { makeRpc } from "./worker-rpc.mjs";
import { BakePool } from "./bake-pool.mjs";

const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const status = (s, bad = false) => {
  $("status").textContent = s;
  $("status").classList.toggle("bad", bad);
};

const loader = {
  show(label) {
    $("loadlabel").textContent = label;
    $("bar").classList.add("indeterminate");
    $("loader").classList.add("show");
  },
  progress(label, frac) {
    $("loadlabel").textContent = label;
    $("bar").classList.remove("indeterminate");
    $("bar").firstElementChild.style.width = `${Math.round(frac * 100)}%`;
    $("loader").classList.add("show");
  },
  hide() { $("loader").classList.remove("show"); },
};

// ---- the engine, in its worker --------------------------------------------
// The PRIMARY engine worker owns the charts, the compositor, and rendering.
// Batches of cell bakes fan out across a BakePool of extra engine workers
// (one wasm instance is single-threaded, so parallel = more instances);
// ?workers=N overrides the pool size.
const workerUrl = new URL("./engine-worker.mjs", location.href);
const wasmUrl = new URL(q.get("wasm") || "./tile57-engine.wasm", location.href).href;
const bakeWorkers = Math.min(8, Math.max(1,
  parseInt(q.get("workers")) || Math.min(4, (navigator.hardwareConcurrency || 2) - 1)));
const worker = new Worker(workerUrl, { type: "module" });
const rpc = makeRpc(worker);

worker.onerror = (e) => {
  console.error(e);
  status(`engine worker failed: ${e.message ?? "see console"}`, true);
};

loader.show("downloading the engine (a few MB on first visit)…");
let version;
try {
  ({ version } = await rpc("init", { wasmUrl }));
} catch (e) {
  console.error(e);
  $("loadlabel").textContent = `engine failed to start: ${e.message}`;
  $("spin").style.display = "none";
  $("bar").style.display = "none";
  status("engine failed to start", true);
  throw e;
}

// Theme the chrome from the engine's own S-52 colour table (day). The CSS
// fallbacks carry the same values, so this only matters if they drift.
try {
  const day = (await rpc("palette")).day;
  const root = document.documentElement.style;
  for (const [token, cssVar] of [
    ["NODTA", "--nodta"], ["UIBCK", "--uibck"], ["UIBDR", "--uibdr"],
    ["UINFD", "--uinfd"], ["UINFF", "--uinff"], ["UINFB", "--uinfb"],
    ["UINFR", "--uinfr"], ["CURSR", "--cursr"],
  ]) if (day?.[token]) root.setProperty(cssVar, day[token]);
} catch (e) {
  console.warn("palette theming skipped:", e);
}

// ---- renderer: WebGPU, or PNG views ---------------------------------------
const dpr = Math.min(devicePixelRatio || 1, 2);
const canvas = $("map"), img = $("mapimg");
let gpu = null, gpuWhy = "";
if (q.get("png")) gpuWhy = "?png=1";
else if (!isSecureContext) gpuWhy = "insecure context — WebGPU needs https or localhost";
else if (!GpuRenderer.supported()) gpuWhy = "navigator.gpu is not exposed";
else {
  try {
    loader.show("baking symbol + glyph atlases…");
    gpu = await GpuRenderer.create(canvas, dpr, await rpc("gpuAssets", { pixelRatio: dpr }));
  } catch (e) {
    console.error(e);
    gpuWhy = e.message;
  }
}
const surface = gpu ? canvas : img;
if (!gpu) { canvas.style.display = "none"; img.style.display = "block"; }
$("mode").textContent = `${version} wasm — ${gpu ? "WebGPU" : "PNG"}`;
if (!gpu && gpuWhy) status(`PNG fallback: ${gpuWhy}`);

// ---- state ----------------------------------------------------------------
const charts = []; // {name, handle, info}
let compose = 0;
const cam = { lon: -73.16, lat: 41.14, zoom: 13 };
let sceneCam = null; // camera the current scene / PNG was built for

const viewW = () => innerWidth, viewH = () => innerHeight;
function sizeCanvas() {
  canvas.width = Math.max(1, Math.round(viewW() * dpr));
  canvas.height = Math.max(1, Math.round(viewH() * dpr));
}
sizeCanvas();

function hud() {
  $("charts").textContent = charts.length
    ? `${charts.length} chart${charts.length > 1 ? "s" : ""}: ${charts.map((c) => c.name).slice(0, 4).join(", ")}${charts.length > 4 ? ", …" : ""}`
    : "no charts";
  $("center").textContent = `${cam.lat.toFixed(4)}, ${cam.lon.toFixed(4)}  z${cam.zoom.toFixed(1)}  ≈1:${Math.round(scaleDenom(cam.zoom)).toLocaleString()}`;
  $("hint").style.display = charts.length ? "none" : "flex";
}
loader.hide();
hud();
if (!gpuWhy) status("ready — drop charts to begin");

// ---- view rebuild (the worker portrays / renders) -------------------------
let rebuildTimer = 0, rebuilding = false, rebuildAgain = false;
function scheduleRebuild(ms = 250) {
  clearTimeout(rebuildTimer);
  rebuildTimer = setTimeout(rebuild, ms);
}
async function rebuild() {
  if (!charts.length) return;
  if (rebuilding) { rebuildAgain = true; return; }
  rebuilding = true;
  const t0 = performance.now();
  const [w, h] = [Math.round(viewW() * dpr), Math.round(viewH() * dpr)];
  const view = { compose, chart: charts[0]?.handle, lon: cam.lon, lat: cam.lat, zoom: cam.zoom, w, h };
  try {
    if (gpu) {
      const scene = await rpc("gpuScene", { ...view, pixelRatio: dpr, atlasHave: gpu.atlasHave, halo: gpu.halo });
      gpu.setScene(scene);
      gpu.draw(cam);
      $("perf").textContent = `scene ${(performance.now() - t0).toFixed(0)} ms, ${gpu.draws.length} draws @${w}×${h}`;
    } else {
      const png = await rpc("png", view);
      if (img.dataset.url) URL.revokeObjectURL(img.dataset.url);
      img.dataset.url = URL.createObjectURL(new Blob([png], { type: "image/png" }));
      img.src = img.dataset.url;
      img.style.transform = "";
      $("perf").textContent = `render ${(performance.now() - t0).toFixed(0)} ms @${w}×${h}`;
    }
    sceneCam = { ...cam };
  } catch (e) {
    console.error(e);
    status(`render failed: ${e.message}`, true);
  }
  rebuilding = false;
  if (rebuildAgain) { rebuildAgain = false; scheduleRebuild(0); }
  hud();
}

// GPU: any camera change redraws the uploaded scene immediately.
let rafPending = false;
function redraw() {
  hud();
  if (!gpu || !charts.length || rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; gpu.draw(cam); });
}

// ---- mouse / touch navigation --------------------------------------------
const cssWorld = () => 256 * 2 ** cam.zoom; // CSS px per world unit
function panBy(dxCss, dyCss) {
  const [cx, cy] = lonLatToWorld(cam.lon, cam.lat);
  const s = cssWorld();
  [cam.lon, cam.lat] = worldToLonLat(cx - dxCss / s, Math.min(0.9999, Math.max(0.0001, cy - dyCss / s)));
}
function zoomAt(mx, my, dz) {
  const oldS = cssWorld();
  const [cx, cy] = lonLatToWorld(cam.lon, cam.lat);
  const wx = cx + (mx - viewW() / 2) / oldS, wy = cy + (my - viewH() / 2) / oldS;
  cam.zoom = Math.min(18, Math.max(2, cam.zoom + dz));
  const s = cssWorld();
  [cam.lon, cam.lat] = worldToLonLat(wx - (mx - viewW() / 2) / s, Math.min(0.9999, Math.max(0.0001, wy - (my - viewH() / 2) / s)));
}

let drag = null;
surface.addEventListener("pointerdown", (e) => {
  if (!charts.length) return;
  surface.setPointerCapture(e.pointerId);
  surface.classList.add("dragging");
  drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
});
surface.addEventListener("pointermove", (e) => {
  const [wcx, wcy] = lonLatToWorld(cam.lon, cam.lat);
  const px = wcx + (e.clientX - viewW() / 2) / cssWorld();
  const py = wcy + (e.clientY - viewH() / 2) / cssWorld();
  const [lon, lat] = worldToLonLat(px, Math.min(0.9999, Math.max(0.0001, py)));
  $("cursor").textContent = `cursor ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
  if (!drag) return;
  panBy(e.clientX - drag.x, e.clientY - drag.y);
  drag.x = e.clientX; drag.y = e.clientY;
  if (gpu) redraw();
  else img.style.transform = `translate(${e.clientX - drag.sx}px, ${e.clientY - drag.sy}px)`;
});
surface.addEventListener("pointerup", () => {
  if (!drag) return;
  surface.classList.remove("dragging");
  drag = null;
  scheduleRebuild(gpu ? 250 : 0);
});
surface.addEventListener("wheel", (e) => {
  if (!charts.length) return;
  e.preventDefault();
  const dz = -e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0022);
  zoomAt(e.clientX, e.clientY, dz);
  if (gpu) redraw();
  else {
    const k = 2 ** (cam.zoom - (sceneCam?.zoom ?? cam.zoom));
    img.style.transformOrigin = `${e.clientX}px ${e.clientY}px`;
    img.style.transform = `scale(${k})`;
  }
  scheduleRebuild(gpu ? 300 : 350);
}, { passive: false });
surface.addEventListener("dblclick", (e) => {
  if (!charts.length) return;
  zoomAt(e.clientX, e.clientY, 1);
  if (gpu) redraw();
  scheduleRebuild(0);
});
$("zi").onclick = () => { zoomAt(viewW() / 2, viewH() / 2, 1); if (gpu) redraw(); scheduleRebuild(0); };
$("zo").onclick = () => { zoomAt(viewW() / 2, viewH() / 2, -1); if (gpu) redraw(); scheduleRebuild(0); };
$("fs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
addEventListener("resize", () => { sizeCanvas(); if (gpu) redraw(); scheduleRebuild(200); });
addEventListener("keydown", (e) => {
  if (!charts.length) return;
  const pan = 120;
  const moves = {
    ArrowLeft: () => panBy(pan, 0), ArrowRight: () => panBy(-pan, 0),
    ArrowUp: () => panBy(0, pan), ArrowDown: () => panBy(0, -pan),
    "+": () => zoomAt(viewW() / 2, viewH() / 2, 1),
    "=": () => zoomAt(viewW() / 2, viewH() / 2, 1),
    "-": () => zoomAt(viewW() / 2, viewH() / 2, -1),
  };
  const move = moves[e.key];
  if (!move) return;
  e.preventDefault();
  move();
  if (gpu) redraw();
  scheduleRebuild(gpu ? 250 : 300);
});

// ---- loading charts -------------------------------------------------------
function fitTo(list) {
  let west = 180, south = 90, east = -180, north = -90, ok = false;
  for (const c of list) {
    if (!c.info.hasBounds) continue;
    ok = true;
    west = Math.min(west, c.info.west); south = Math.min(south, c.info.south);
    east = Math.max(east, c.info.east); north = Math.max(north, c.info.north);
  }
  if (!ok) return;
  const [wx0, wy0] = lonLatToWorld(west, north), [wx1, wy1] = lonLatToWorld(east, south);
  const z = Math.log2(Math.min((viewW() * 0.9) / (256 * (wx1 - wx0)), (viewH() * 0.9) / (256 * (wy1 - wy0))));
  cam.zoom = Math.min(16, Math.max(3, z));
  [cam.lon, cam.lat] = worldToLonLat((wx0 + wx1) / 2, (wy0 + wy1) / 2);
}

async function openArchive(name, archive) {
  if (charts.some((c) => c.name === name)) return null; // already loaded
  const { handle, info } = await rpc("openChartBytes", { bytes: archive }, [archive.buffer]);
  const chart = { name, handle, info };
  charts.push(chart);
  return chart;
}

// One unit of load work per cell: [stem, doneLabel] generator-style entries so
// the loader can show N of M across plain cells and zip members alike.
let loading = false, dropSeq = 0;
async function loadFiles(files) {
  if (loading) { status("still loading the previous drop…"); return; }
  loading = true;
  const added = [], failed = [];
  try {
    // Classify the drop: zips, and .000 cells grouped with their updates.
    const groups = new Map();
    const zips = [];
    for (const f of files) {
      if (/\.zip$/i.test(f.name)) zips.push(f);
      else if (/\.\d{3}$/.test(f.name)) {
        const stem = f.name.replace(/\.\d{3}$/, "");
        if (!groups.has(stem)) groups.set(stem, []);
        groups.get(stem).push(f);
      }
    }

    // Cells straight from the drop. `run(pool)` bakes on a pool slot, or on
    // the primary engine when the batch is too small for a pool.
    const work = []; // {stem, run: async (pool|null) => archive|null}
    for (const [stem, cellFiles] of groups) {
      if (!cellFiles.some((f) => /\.000$/.test(f.name))) {
        failed.push(`${stem}: update files without the .000 base`);
        continue;
      }
      work.push({
        stem,
        run: async (pool) => {
          const bytes = await Promise.all(cellFiles.map(async (f) => ({
            name: f.name,
            bytes: new Uint8Array(await f.arrayBuffer()),
          })));
          if (pool) return pool.bake(stem, bytes);
          try {
            for (const f of bytes)
              await rpc("addFile", { path: `drops/${stem}/${f.name}`, bytes: f.bytes }, [f.bytes.buffer]);
            return await rpc("bakeCell", { path: `/enc/drops/${stem}/${stem}.000` });
          } finally {
            rpc("remove", { path: `drops/${stem}` }).catch(() => {});
          }
        },
      });
    }

    // Cells inside each dropped zip. The zip lives in the primary engine
    // (which lists and extracts it); each cell's extracted files shuttle to a
    // pool slot for the bake, so extraction streams while bakes run wide.
    const zipPaths = [];
    for (const zf of zips) {
      const id = `z${dropSeq++}`;
      const bytes = new Uint8Array(await zf.arrayBuffer());
      await rpc("addFile", { path: `zips/${id}.zip`, bytes }, [bytes.buffer]);
      zipPaths.push(`zips/${id}.zip`);
      loader.show(`reading ${zf.name}…`);
      const entries = await rpc("zipList", { path: `/enc/zips/${id}.zip` });
      const byDir = new Map();
      for (const en of entries) {
        const dir = en.name.replace(/[^/]*$/, "");
        if (!byDir.has(dir)) byDir.set(dir, []);
        byDir.get(dir).push(en.name);
      }
      for (const en of entries) {
        if (!/\.000$/.test(en.name)) continue;
        const stem = en.name.replace(/^.*\//, "").replace(/\.000$/, "");
        const dir = en.name.replace(/[^/]*$/, "");
        // The cell and everything beside it (updates, referenced text).
        const names = byDir.get(dir).filter((n) => !n.endsWith("/"));
        const outPaths = names.map((n) => `/enc/drops/${id}/${stem}/${n.replace(/^.*\//, "")}`);
        work.push({
          stem,
          run: async (pool) => {
            try {
              await rpc("zipExtract", { path: `/enc/zips/${id}.zip`, names, outPaths });
              if (!pool) return await rpc("bakeCell", { path: `/enc/drops/${id}/${stem}/${stem}.000` });
              const files = await Promise.all(outPaths.map(async (p) => ({
                name: p.replace(/^.*\//, ""),
                bytes: await rpc("readFile", { path: p }),
              })));
              return await pool.bake(stem, files);
            } finally {
              // The extracted files are done with as soon as the bake is —
              // a big exchange set must not accumulate in the primary.
              rpc("remove", { path: `/enc/drops/${id}/${stem}` }).catch(() => {});
            }
          },
        });
      }
    }

    // Bake, `lanes` cells at a time. Opens land on the primary as bakes
    // finish, so charts appear in completion order.
    const lanes = Math.min(bakeWorkers, work.length);
    const pool = lanes > 1 ? new BakePool(workerUrl, wasmUrl, lanes) : null;
    let done = 0, next = 0;
    loader.progress(`baking — 0 of ${work.length}${pool ? ` (${lanes} workers)` : ""}`, 0);
    const lane = async () => {
      while (next < work.length) {
        const { stem, run } = work[next++];
        status(`baking ${stem}…`);
        try {
          const t0 = performance.now();
          const arc = await run(pool);
          if (!arc) { failed.push(`${stem}: produced no archive`); continue; }
          const c = await openArchive(stem, arc);
          if (c) { added.push(c); status(`${stem}: baked in ${(performance.now() - t0).toFixed(0)} ms`); }
        } catch (e) {
          console.error(e);
          failed.push(`${stem}: ${e.message}`);
        } finally {
          done++;
          loader.progress(`baking — ${done} of ${work.length}${pool ? ` (${lanes} workers)` : ""}`, done / work.length);
        }
      }
    };
    try {
      await Promise.all(Array.from({ length: Math.max(1, lanes) }, lane));
    } finally {
      pool?.close();
      // The batch is over: the zips (and anything left under drops/) are done
      // with. Chart archives live inside the engine, not the file tree.
      for (const p of zipPaths) rpc("remove", { path: p }).catch(() => {});
      rpc("remove", { path: "drops" }).catch(() => {});
    }
  } finally {
    loader.hide();
    loading = false;
  }

  if (failed.length) status(failed.slice(0, 2).join("; ") + (failed.length > 2 ? ` (+${failed.length - 2} more, see console)` : ""), true);
  if (!added.length) { hud(); return; }

  // Rebuild the composite over everything loaded (it borrows the charts).
  if (compose) await rpc("composeClose", { handle: compose });
  compose = charts.length > 1 ? await rpc("composeOpen", { handles: charts.map((c) => c.handle) }) : 0;
  fitTo(added);
  status(`${charts.length} chart${charts.length > 1 ? "s" : ""} ready${failed.length ? ` (${failed.length} failed)` : ""}`);
  await rebuild();
}

// ---- drag & drop (the early script above catches and queues the events) ---
window.tile57Drops.handler = (files) => loadFiles(files);
if (window.tile57Drops.pending.length) loadFiles(window.tile57Drops.pending.splice(0));

// ---- optional preload (?cells=) -------------------------------------------
const preload = q.get("cells");
if (preload) {
  const encBase = q.get("enc") || "./enc";
  const files = [];
  for (const cell of preload.split(",")) {
    status(`fetching ${cell}…`);
    const r = await fetch(`${encBase}/${cell}`);
    if (!r.ok) { status(`fetch ${cell}: ${r.status}`, true); continue; }
    files.push(new File([await r.blob()], cell.replace(/^.*\//, "")));
  }
  if (files.length) await loadFiles(files);
}
</script>
</body>
</html>
