name: Docs

on:
  push:
    branches: [main]
    # The site ships the live wasm chartplotter demo, so engine changes
    # redeploy it too — the demo always runs the current engine.
    paths:
      - "docs/**"
      - "bindings/wasm/**"
      - "src/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Recursive: the wasm engine embeds the portrayal catalogue submodule.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The live demo: the full engine as wasm plus the demo page, staged
      # under static/demo-app/ and embedded by src/pages/demo.jsx at /demo.
      # GitHub Pages is https, so WebGPU is available to it. ReleaseSmall:
      # one third the download, and this workload runs just as fast.
      - name: Build wasm engine
        run: zig build wasm-engine -Doptimize=ReleaseSmall

      - name: Stage demo
        run: |
          mkdir -p docs/static/demo-app
          cp bindings/wasm/demo.html docs/static/demo-app/index.html
          cp bindings/wasm/wasi-shim.mjs bindings/wasm/tile57.mjs \
             bindings/wasm/gpu-renderer.mjs bindings/wasm/engine-worker.mjs \
             bindings/wasm/worker-rpc.mjs bindings/wasm/bake-pool.mjs \
             docs/static/demo-app/
          cp zig-out/bin/tile57-engine.wasm docs/static/demo-app/

      # No committed lockfile, so `npm install` (not `npm ci`).
      - name: Install
        working-directory: docs
        run: npm install

      - name: Build
        working-directory: docs
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
